services:

  # MySQL DB
  mysql:
    image: mysql:8.0
    container_name: berka_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ETL 파이프라인 (CSV → MySQL)
  etl:
    build: .
    container_name: berka_etl
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    volumes:
      - ./data:/app/data
      - .:/app

  # 이상 탐지 파이프라인 (MySQL → anomaly_flags)
  detection:
    build: .
    container_name: berka_detection
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DATABASE_URL: "mysql+pymysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}"
    volumes:
      - ./data:/app/data
      - .:/app
    command: ["python", "detection_pipeline.py"]

volumes:
  mysql_data: